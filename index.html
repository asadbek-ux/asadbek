<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ob-havo 24</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <div class="ny">
            <div class="newyork">
                <img src="./img/Frame 3.png" alt="">
                <h3>New York</h3>
                <img src="./img/Frame.png" alt="">
            </div>

            <h2>Cloudy</h2>
            <h1>26°C</h1>
            <p>Sunday | 12 Dec 2023</p>
        </div>

        <div class="cld">
            <img src="./img/cloud.png" alt="">
        </div>

        <div id="MyClockDisplay" class="clock" onload="showTime()">
    
        </div>
    </header>

    <main>
        <div class="article1">
            <img  class="pic" src="./img/card1.png" alt="">

            <div class="card">
                <img src="./img/cloud.png" alt="">
                <p>weather</p>
            </div>

            <div class="card">
                <img src="./img/Explore.png" alt="">
                <p>explore</p>
            </div>

            <div class="card">
                <img src="./img/Location.png" alt="">
                <p>cities</p>
            </div>

            <div class="card">
                <img src="./img/Settings-alt.png" alt="">
                <p>settings</p>
            </div>
        </div>

        <div class="article2">
            <div class="activities">
                <div class="title">
                    <img src="./img/hurticon.png" alt="">
                    <h3>Activities in your area</h3>
                </div>

                <div class="cards">
                    <div class="card">
                        <img src="./img/Rectangle 15.png" alt="">
                        <p>2km away</p>
                    </div>

                    <div class="card">
                        <img src="./img/Rectangle 16.png" alt="">
                        <p>1.5km away</p>
                    </div>


                    <div class="card">
                        <img src="./img/Rectangle 17.png" alt="">
                        <p>3km away</p>
                    </div>


                    <div class="card">
                        <img src="./img/Rectangle 18.png" alt="">
                        <p>500m away</p>
                    </div>
                    
                </div>
            </div>


            <div class="forecast">
                <div class="title">
                    <img src="./img/Group.png" alt="">
                    <h4>24-hour forecast</h4>
                </div>
            </div>


        </div>

        <div class="article3">
            <img src="./img/Group 52.png" alt="">

            <h3>AIR CONDITIONS</h3>

            <div class="ac">
                <div class="card">
                    <div class="aa">
                        <img src="./img/ICON.png" alt="">   
                        <p>Real Feel</p>
                    </div>
                    <h4>30°</h4>
                </div>

                <div class="card">
                    <div class="aa">
                        <img src="./img/Frame (1).png" alt="">   
                        <p>Wind</p>
                    </div>
                    <h4>0.8 km/hr</h4>
                </div>


                <div class="card">
                    <div class="aa">
                        <img src="./img/Frame (2).png" alt="">   
                        <p>Chance of rain</p>
                    </div>
                    <h4>2%</h4>
                </div>


                <div class="card">
                    <div class="aa">
                        <img src="./img/Icon.svg" alt="">   
                        <p>UV Index</p>
                    </div>
                    <h4>4</h4>
                </div>
            </div>
        </div>
    </main>









    <script src="./script.js"></script>
</body>
</html>
